<div class="container py-4" style="background: #f5f6fa; min-height: 100vh;">
  <h2 class="fw-bold mb-2" style="font-size:2rem;">Crear Post - Paso 4 de 5</h2>
  <div class="mb-4">
    <div class="d-flex justify-content-center mb-3">
        <app-progress-bar [currentStep]="3"></app-progress-bar>
    </div>
  </div>
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <h5 class="fw-semibold mb-3">Descripción del post</h5>
      <div class="mb-3">
        <label class="form-label">Público objetivo</label>
        <input type="text" class="form-control" placeholder="Adolescentes">
      </div>
      <div class="mb-3">
        <label class="form-label">Tipo de tema</label>
        <input type="text" class="form-control" placeholder="General">
      </div>
      <div class="mb-3 d-flex align-items-end">
        <div class="flex-grow-1 me-2">
          <label class="form-label">Tono del contenido</label>
          <input type="text" class="form-control" placeholder="Agradable">
        </div>
        <button class="btn btn-primary mb-1" style="background:#4A64F6; font-weight:600;">Generar con IA</button>
      </div>
    </div>
  </div>
</div>
