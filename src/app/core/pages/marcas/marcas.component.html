<div>
  <h1 style="font-size:2.5rem; font-weight:700; color:#222; margin-bottom:2rem;">Mis marcas</h1>
  <ng-container *ngIf="marcas && marcas.length > 0; else noBrands">
    <div class="brands-grid">
      <div *ngFor="let marca of marcas" class="brand-card" style="cursor: pointer;" (click)="createPost()">
        <div class="edit position-absolute" style="right: 15px; top: 5px;">
          <button *ngIf="origin === 'brands'" mat-icon-button [matMenuTriggerFor]="menu" class="btn">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu class="bg-white" #menu="matMenu">
            <button mat-menu-item (click)="editBrand(marca.id)">
              <mat-icon>edit</mat-icon>
              <span>Editar marca</span>
            </button>
            <button mat-menu-item (click)="deleteBrand(marca.id)">
              <mat-icon>delete</mat-icon>
              <span>Eliminar marca</span>
            </button>
          </mat-menu>
        </div>
        <div class="brand-logo">
          <span>LOGO</span>
        </div>
        <div class="brand-name d-flex flex-column align-items-center">
          <strong>{{ marca.name }}</strong>
          <small>{{ marca.description }}</small>
        </div>
      </div>
      <button *ngIf="origin === 'brands'" class="brand-card add-card" type="button" (click)="abrirCreateBrandView($event)">
        <span class="add-icon">+</span>
      </button>
    </div>
  </ng-container>
  <ng-template #noBrands>
    <div class="no-brands">
      <p style="font-size:1.3rem; color:#333; margin-bottom:1.5rem;">Aún no tienes marcas registradas.</p>
      <button *ngIf="origin === 'brands'" class="add-card" (click)="abrirCreateBrandView($event)" style="width:180px; height:180px; font-size:3rem;">
        +
      </button>
      <p style="margin-top:1rem; color:#555;">Haz clic para añadir tu primera marca</p>
    </div>
  </ng-template>
</div>
