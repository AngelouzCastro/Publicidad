<div class="container py-4" style="background: #f5f6fa; min-height: 100vh;" (document:click)="onDocumentClick($event)">
  <div class="d-flex justify-content-center mb-3">
    <app-progress-bar [currentStep]="1"></app-progress-bar>
  </div>
  <div class="mx-auto bg-white rounded-4 p-4" style="max-width: 600px;">
    <h1 class="fw-bold mb-1" style="font-size:2.5rem; color:#23243a;">MEDIA</h1>
    <div class="text-secondary mb-4" style="font-size:1.1rem; font-weight:600; letter-spacing:1px;">REFERENCIA</div>
    
    <label class="fw-semibold mb-2" style="font-size:1.2rem; color:#23243a;">Referencia</label>
    <div class="row g-3 mb-4">
      <ng-container *ngFor="let img of referencias; let i = index">
        <div class="col-4">
          <div class="border rounded-3 bg-light d-flex align-items-center justify-content-center position-relative" style="min-height:90px;">
            <img *ngIf="img" [src]="img" alt="Referencia" class="img-fluid rounded-3" style="max-height:80px; max-width:100%;">
            <button *ngIf="img" type="button" class="btn-close position-absolute top-0 end-0 m-2" aria-label="Eliminar" (click)="eliminarReferencia(i)"></button>
            <span *ngIf="!img" class="text-muted">Sin imagen</span>
          </div>
        </div>
      </ng-container>
      <div class="col-4" *ngIf="referencias.length < 3">
        <label class="w-100 h-100">
          <input type="file" accept="image/*" (change)="agregarReferencia($event)" hidden>
          <div class="border rounded-3 bg-white d-flex align-items-center justify-content-center" style="min-height:90px; cursor:pointer;">
            <span class="fs-1 text-info">+</span>
          </div>
        </label>
      </div>
    </div>

    <label class="fw-semibold mb-2" style="font-size:1.2rem; color:#23243a;">Producto</label>
    <div class="row g-3 mb-4">
      <ng-container *ngFor="let img of productos; let i = index">
        <div class="col-6">
          <div class="border rounded-3 bg-light d-flex align-items-center justify-content-center position-relative" style="min-height:90px;">
            <img *ngIf="img" [src]="img" alt="Producto" class="img-fluid rounded-3" style="max-height:80px; max-width:100%;">
            <button *ngIf="img" type="button" class="btn-close position-absolute top-0 end-0 m-2" aria-label="Eliminar" (click)="eliminarProducto(i)"></button>
            <span *ngIf="!img" class="text-muted">Sin imagen</span>
          </div>
        </div>
      </ng-container>
      <div class="col-6" *ngIf="productos.length < 2">
        <label class="w-100 h-100">
          <input type="file" accept="image/*" (change)="agregarProducto($event)" hidden>
          <div class="border rounded-3 bg-white d-flex align-items-center justify-content-center" style="min-height:90px; cursor:pointer;">
            <span class="fs-1 text-info">+</span>
          </div>
        </label>
      </div>
    </div>

    <label class="fw-semibold mb-2" style="font-size:1.2rem; color:#23243a;">
      COLORES <span class="text-secondary fw-normal" style="font-size:1rem;">PRIMARIOS</span>
    </label>
    <div class="d-flex gap-3 flex-wrap mb-3">
      <ng-container *ngFor="let color of colores; let i = index">
        <div class="position-relative">
          <div class="rounded-3 px-4 py-2 fw-semibold border"
               [ngStyle]="{'background': color, 'color': '#23243a', 'font-size':'1.1rem', 'border-width':'1.5px', 'cursor':'pointer'}"
               (click)="abrirColorSketch(i, $event)">
            {{ color }}
          </div>
          <div *ngIf="colorActivo === i" #sketchRef class="mt-2 position-absolute" style="z-index:10;" [attr.data-index]="i">
            <color-sketch [(color)]="colores[i]" [presetColors]="[]" (onChangeComplete)="actualizarColor($event.color.hex, i)"></color-sketch>
          </div>
        </div>
      </ng-container>
    </div>
    <div class="d-flex justify-content-between mt-4">
      <button type="button"
              class="btn btn-outline-secondary px-4 py-2"
              style="font-weight:600; border-radius:8px;"
              routerLink="/crear-marca">
        Atrás
      </button>
      <button type="button"
              class="btn btn-primary px-4 py-2"
              style="font-weight:600; border-radius:8px; background:#3B5BDB; border:none;"
              (click)="siguiente()">
        Siguiente
      </button>
    </div>
  </div>
</div>
