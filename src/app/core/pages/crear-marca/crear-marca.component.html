
<div style="background: #f5f6fa; min-height: 100vh; padding: 2rem;">
  <!-- Progress Bar de 5 pasos -->
  <app-progress-bar></app-progress-bar>
  <!-- Formulario de crear marca -->
  <div style="background: #fff; border-radius: 20px; padding: 2rem; max-width: 600px; margin: 0 auto;">
    <h1 style="font-size:2.5rem; font-weight:700; color:#222; margin-bottom:2rem;">Generar Marca</h1>
    <button (click)="verListaColores()" style="width:100%; background:#7c83f7; color:#fff; font-size:1.1rem; font-weight:600; border:none; border-radius:8px; padding:1rem; margin-bottom:2rem; cursor:pointer;">
      Entrar con red social
    </button>
    <form>
      <label>Nombre</label>
      <input type="text" (focus)="colorActivo = null" style="width:100%; margin-bottom:1rem; padding:0.8rem; border-radius:8px; border:1px solid #d6eaf8;">
      <div style="display:flex; align-items:center; margin-bottom:1.5rem;">
        <label for="logoInput" style="cursor:pointer; margin:0;">
          <div style="width:70px; height:70px; border:2px solid #d6eaf8; border-radius:12px; display:flex; align-items:center; justify-content:center; background:#fafbff; transition:box-shadow 0.2s; position:relative;" [style.boxShadow]="logoUrl ? '0 0 0 2px #3B5BDB' : '0 0 0 2px #d6eaf8'">
            <ng-container *ngIf="!logoUrl">
              <img src="assets/placeholder-image.svg" alt="placeholder" style="width:38px; height:38px; opacity:0.35;">
            </ng-container>
            <ng-container *ngIf="logoUrl">
              <img [src]="logoUrl" alt="Logo seleccionado" style="width:60px; height:60px; object-fit:cover; border-radius:8px;">
            </ng-container>
          </div>
          <input id="logoInput" type="file" accept="image/*" (change)="onLogoSelected($event)" style="display:none;">
        </label>
        <div style="margin-left:1.2rem;">
          <span style="font-size:1.3rem; color:#23243a; font-weight:500;">Logo</span>
          <div *ngIf="logoUrl">
            <button type="button" (click)="cambiarLogo()" style="margin-top:0.5rem; background:none; border:none; color:#3B5BDB; cursor:pointer; font-size:0.95rem;">Cambiar imagen</button>
          </div>
        </div>
      </div>
      <label>Colores de la marca </label>
      <div style="display: flex; align-items: flex-end; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; margin-top: 1rem;">
        <div *ngFor="let color of colores; let i = index" style="position: relative; display: flex; flex-direction: column; align-items: center;">
          <div style="position: relative;">
            <button type="button"
              (click)="colorActivo = i"
              [style.border]="colorActivo === i ? '2px solid #3B5BDB' : '2px solid #e0e0e0'"
              style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; cursor: pointer; transition: border 0.2s; padding: 0;">
              <span [style.background]="color"
                    style="width: 36px; height: 36px; border-radius: 50%; display: block; border: none;">
              </span>
            </button>
            <button *ngIf="colores.length > 2"
              (click)="removerColor(i)"
              style="position: absolute; top: -8px; right: -8px; background: #ff6b6b; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
              ×
            </button>
          </div>
          <span style="display: block; text-align: center; color: #444; margin-top: 2px;">{{ color }}</span>
        </div>
        <button type="button"
          (click)="agregarColor()"
          style="width: 44px; height: 44px; border-radius: 50%; background: #3B5BDB; color: #fff; border: none; font-size: 2rem; display: flex; align-items: center; justify-content: center; margin-left: 0.5rem; cursor: pointer; position: relative; bottom: 20px;">
          +
        </button>
      </div>
      <!-- El color-sketch y el input solo aparecen debajo de la fila de colores, no dentro del ngFor -->
      <div *ngIf="colorActivo !== null" style="margin-bottom: 1.5rem;">
        <color-sketch [(color)]="colores[colorActivo]" [presetColors]="[]" style="margin-bottom: 0.5rem;"
          (onChangeComplete)="actualizarColor($event.color.hex, colorActivo)">
        </color-sketch>
        <input type="text"
          [(ngModel)]="colores[colorActivo]"
          maxlength="7"
          [ngModelOptions]="{standalone: true}"
          style="width: 110px; padding: 0.5rem; border-radius: 6px; border: 1px solid #d6eaf8; font-size: 1rem;"
          placeholder="#000000"
          (focus)="colorActivo = colorActivo">
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;">
      </div>
      <label>Tono de comunicación</label>
      <input type="text" (focus)="colorActivo = null" style="width:100%; margin-bottom:1rem; padding:0.8rem; border-radius:8px; border:1px solid #d6eaf8;">
      <label>Tipografía</label>
      <input type="text" (focus)="colorActivo = null" style="width:100%; margin-bottom:1rem; padding:0.8rem; border-radius:8px; border:1px solid #d6eaf8;">
      <label>Temas frecuentes</label>
      <input type="text" (focus)="colorActivo = null" style="width:100%; margin-bottom:1rem; padding:0.8rem; border-radius:8px; border:1px solid #d6eaf8;">
    </form>
  </div>
</div>
