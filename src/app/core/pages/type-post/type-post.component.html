<div class="container">
  <header class="d-flex justify-content-center mb-3">
    <app-progress-bar></app-progress-bar>
  </header>

  <main class="content">
    <h2>Selecciona un tipo de publicación</h2>
    <div class="type-selection-grid">
        <mat-card
          *ngFor="let type of publicationTypes"
          [class.selected]="selectedType === type.id"
          (click)="selectType(type.id)"
        >
          <mat-card-header>
            <mat-card-title>{{ type.name }}</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <p>{{ type.description }}</p>
            <div class="type-image-container">
              <img [src]="type.image" [alt]="type.name" class="type-image">
            </div>
          </mat-card-content>
        </mat-card>
      </div>
  </main>

  <footer>
    <button mat-button (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="next()" [disabled]="!selectedType">Siguiente</button>
  </footer>
</div>
