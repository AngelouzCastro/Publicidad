<div class="container py-4" style="background: #f5f6fa; min-height: 100vh;">
  <h2 class="fw-bold mb-2" style="font-size:2rem;">Crear Post - Paso 5 de 5</h2>
  <div class="mb-2">Previeweer o Insta</div>
  <div class="mb-4">
    
    <div class="d-flex justify-content-center mb-3">
        <app-progress-bar [currentStep]="4"></app-progress-bar>
      </div>
  </div>
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="border rounded-4 p-3 mb-4 bg-white">
        <div class="d-flex align-items-center mb-2">
          <span class="rounded-circle d-inline-block me-2" style="width:22px; height:22px; background:#6C63FF;"></span>
          <span class="fw-semibold">Petco</span>
        </div>
        <div class="border rounded-3 p-3 bg-light d-flex flex-column align-items-center">
          <div class="rounded-3 d-flex align-items-center justify-content-center mb-3" style="background:#4A64F6; height:60px; width:100%;">
            <span class="fw-bold text-white text-center" style="font-size:1.2rem; line-height:1.1;">NATURAL FOOD<br>FOR HAPPY,<br>HEALTHY PETS</span>
          </div>
          <img src="assets/ejemplo-perro.png" alt="Post" class="img-fluid" style="max-height:120px;">
        </div>
      </div>
      <div class="d-flex justify-content-between gap-3">
        <button class="btn btn-outline-primary px-4 py-1" style="font-weight:600; border-radius:8px;">Guardar</button>
        <button class="btn px-4 py-1" style="font-weight:600; border-radius:8px; background:#6C63FF; color:#fff;">Guardar y publicar</button>
        <button class="btn btn-outline-primary px-4 py-1" style="font-weight:600; border-radius:8px;">Editar</button>
      </div>
    </div>
  </div>
</div>
